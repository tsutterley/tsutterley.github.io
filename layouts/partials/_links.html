{{ if .Links }}
<div class="sideSection">
    <div class="sideSection__heading">
        <h2 class="sideSection__title">{{ i18n "links" }}</h2>
    </div>
    <div class="sideSection__content">
        <ul class="links">
            {{ range .Links }}
            <li>{{ . | safeHTML }}</li>
            {{ end }}
        </ul>
    </div>
</div>
{{ end }}
