{{ if .Software }}
<div id="software" class="sideSection">
    <div class="section__heading">
        <h2 class="section__title">{{ i18n "software" }}</h2>
    </div>
    <div class="section__content">
        <ul class="software">
            <li>
                {{ range .Software }}
                <ul class="software__group">
                    <span>{{ .Family | safeHTML }}</span>
                    <br>
                    {{ range .Items }}
                    <li>{{ . | safeHTML }}</li>
                    {{ end }}
                </ul>
                {{ end }}
            </li>
        </ul>
    </div>
</div>
{{ end }}
